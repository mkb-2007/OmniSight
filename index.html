<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniSight</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="description" content="Autonomous Edge-AI Road Intelligence & Municipal Infrastructure Platform." />
  <meta property="og:title" content="OmniSight" />
  <meta property="og:description" content="Autonomous Edge-AI Road Intelligence & Municipal Infrastructure Platform." />
  <meta property="og:image" content="/favicon.png" />

  <!-- Google Fonts: Plus Jakarta Sans, Outfit, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <!-- Leaflet.js Interactive Map Engine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Application Error Boundary & Scroll Restoration Script -->
  <script>
    // Disable native browser scroll restoration so application strictly controls route entry scroll positions (X=0, Y=0)
    if (typeof window !== 'undefined' && 'scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    window.addEventListener('error', function(e) {
      console.error('[OmniSight Global Error]', e.error || e.message);
      if (!window.omniAppMounted) {
        var boundary = document.getElementById('omnisight-error-boundary');
        var loader = document.getElementById('omnisight-loader');
        var msg = document.getElementById('omnisight-error-message');
        if (loader) loader.style.display = 'none';
        if (msg && e.message) msg.textContent = e.message;
        if (boundary) boundary.style.display = 'flex';
      }
    });
  </script>

  <style>
    :root {
      --primary-cyan: #0284c7;
      --cyan-glow: #0ea5e9;
      --cyan-neon: #00f0ff;
      --accent-indigo: #4f46e5;
      --indigo-glow: #6366f1;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --emerald-glow: #34d399;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      --amber-glow: #fbbf24;
      --bg-slate: #f8fafc;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 84px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior-y: none;
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 12% 12%, rgba(14, 165, 233, 0.09) 0px, transparent 40%),
        radial-gradient(at 88% 8%, rgba(99, 102, 241, 0.08) 0px, transparent 38%),
        radial-gradient(at 50% 90%, rgba(16, 185, 129, 0.05) 0px, transparent 45%);
      background-attachment: fixed;
      color: #0f172a;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      letter-spacing: -0.025em;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Modern Custom Scrollbar with Translucent Gradient */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.65);
      backdrop-filter: blur(12px);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #94a3b8 0%, #64748b 100%);
      border-radius: 9999px;
      border: 2px solid rgba(241, 245, 249, 0.7);
      transition: background 250ms ease;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #0284c7 0%, #2563eb 100%);
    }

    /* Branded Selection Highlight */
    ::selection {
      background: rgba(14, 165, 233, 0.22);
      color: #0284c7;
    }

    /* Futuristic Cyber Glow & Gradient Text System */
    .gradient-text-cyan {
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 40%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gradient-text-emerald {
      background: linear-gradient(135deg, #059669 0%, #10b981 40%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gradient-text-purple {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 40%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Cyber Button with Shimmer & Glow */
    @keyframes buttonShimmer {
      0% { transform: translateX(-150%) skewX(-20deg); }
      100% { transform: translateX(250%) skewX(-20deg); }
    }
    .btn-cyber-primary {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 45%, #4f46e5 100%);
      box-shadow: 0 4px 20px -2px rgba(14, 165, 233, 0.42), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      position: relative;
      overflow: hidden;
      transition: all 280ms var(--ease-spring);
    }
    .btn-cyber-primary::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      transform: translateX(-150%) skewX(-20deg);
      pointer-events: none;
    }
    .btn-cyber-primary:hover::after {
      animation: buttonShimmer 1.5s infinite;
    }
    .btn-cyber-primary:hover {
      box-shadow: 0 10px 30px -2px rgba(14, 165, 233, 0.6), 0 0 25px rgba(99, 102, 241, 0.35);
      transform: translateY(-2px);
    }

    /* Glassmorphic Cyber Card */
    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.06);
      transition: all 300ms var(--ease-spring);
    }
    .glass-panel:hover {
      background: rgba(255, 255, 255, 0.96);
      border-color: rgba(14, 165, 233, 0.45);
      box-shadow: 0 20px 40px -12px rgba(14, 165, 233, 0.18), 0 0 0 1px rgba(14, 165, 233, 0.2);
      transform: translateY(-5px);
    }

    /* Floating Capsule Pill Nav */
    .capsule-nav {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
    }

    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-pulse-subtle { animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes ping-slow {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .animate-ping-slow { animation: ping-slow 2s cubic-bezier(0, 0, 0.2, 1) infinite; }

    /* Ultra-smooth Page & Section Enter Transitions */
    @keyframes fadeInUpSubtle {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.992);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .page-enter {
      animation: fadeInUpSubtle 380ms var(--ease-spring) forwards;
      will-change: transform, opacity;
    }

    /* Staggered card animations for grid layouts */
    @keyframes staggerSlideUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .stagger-1 { animation: staggerSlideUp 380ms var(--ease-spring) 40ms both; }
    .stagger-2 { animation: staggerSlideUp 380ms var(--ease-spring) 100ms both; }
    .stagger-3 { animation: staggerSlideUp 380ms var(--ease-spring) 160ms both; }
    .stagger-4 { animation: staggerSlideUp 380ms var(--ease-spring) 220ms both; }

    /* Smooth Micro-Interactions for Buttons, Inputs & Interactive Cards */
    button, a, input, select, textarea, [role="button"] {
      transition: all 220ms var(--ease-spring);
    }
    button:active:not(:disabled), [role="button"]:active {
      transform: scale(0.972);
    }
    .interactive-card {
      transition: transform 300ms var(--ease-spring), box-shadow 300ms var(--ease-spring), border-color 250ms ease;
    }
    .interactive-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px -15px rgba(2, 132, 199, 0.12), 0 0 0 1px rgba(14, 165, 233, 0.25);
    }

    /* Ambient Floating Orbs */
    @keyframes ambientFloat1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -25px) scale(1.08); }
      66% { transform: translate(-25px, 20px) scale(0.95); }
    }
    @keyframes ambientFloat2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(-25px, 30px) scale(1.06); }
      66% { transform: translate(30px, -15px) scale(0.94); }
    }
    .ambient-orb-cyan {
      animation: ambientFloat1 18s ease-in-out infinite;
    }
    .ambient-orb-indigo {
      animation: ambientFloat2 22s ease-in-out infinite;
    }

    /* Iridescent Headline Shimmer */
    @keyframes headlineGradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .hero-gradient-headline {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 25%, #4f46e5 50%, #8b5cf6 75%, #0ea5e9 100%);
      background-size: 250% 250%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: headlineGradientShift 8s ease infinite;
    }

    /* Animated Laser Sweep Line on Hero Visual */
    @keyframes scanBeamVertical {
      0% { top: 0%; opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { top: 100%; opacity: 0; }
    }
    .hero-laser-sweep {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, #00e5ff 30%, #38bdf8 50%, #818cf8 70%, transparent 100%);
      box-shadow: 0 0 15px #00e5ff, 0 0 30px #38bdf8;
      animation: scanBeamVertical 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      pointer-events: none;
    }

    /* Floating Interactive Pills */
    .pill-interactive {
      transition: all 260ms var(--ease-spring);
    }
    .pill-interactive:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 20px -4px rgba(14, 165, 233, 0.25);
    }

    /* Modal dialog popup animation */
    @keyframes modalScaleIn {
      0% {
        opacity: 0;
        transform: scale(0.95) translateY(8px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .modal-animate {
      animation: modalScaleIn 280ms var(--ease-spring) forwards;
      will-change: transform, opacity;
    }

    /* Toast notification slide-in */
    @keyframes toastSlideIn {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .toast-enter {
      animation: toastSlideIn 240ms var(--ease-spring) forwards;
    }

    /* ========================================================================= */
    /* OMNISIGHT PRODUCTION STARTUP / LOADING SCREEN STYLES                      */
    /* ========================================================================= */
    #omnisight-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background-color: #f1f5f9;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      visibility: visible;
      transition: opacity 450ms cubic-bezier(0.4, 0, 0.2, 1), visibility 450ms;
      user-select: none;
    }

    #omnisight-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* 16:9 Aspect Ratio Stage covering viewport without distortion */
    .loading-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: max(100vw, calc(100vh * 16 / 9));
      height: max(calc(100vw * 9 / 16), 100vh);
      overflow: hidden;
    }

    /* Smooth Dynamic Shimmer Highlight across the Cyan-Blue Gradient Bar */
    @keyframes barShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .progress-fill-shimmer {
      background: linear-gradient(
        90deg,
        #1d64ec 0%,
        #2a88fe 25%,
        #38bdf8 50%,
        #19e0ef 75%,
        #0ceed2 100%
      );
      background-size: 200% 100%;
      animation: barShimmer 3s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.5), 0 0 4px rgba(42, 136, 254, 0.6);
    }

    /* Concentric Ground Radar Pulse Waves on Bus (78.6%, 66.8%) */
    @keyframes sensorRingExpand {
      0% {
        transform: translate(-50%, -50%) scale(0.2, 0.08);
        opacity: 0.9;
      }
      50% {
        opacity: 0.6;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.5, 1.1);
        opacity: 0;
      }
    }

    .sensor-ring {
      position: absolute;
      top: 88.5%;
      left: 81.5%;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 229, 255, 0.85);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.5), inset 0 0 8px rgba(0, 229, 255, 0.25);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.2, 0.08);
      animation: sensorRingExpand 2.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .sensor-ring-delay-1 {
      animation-delay: 0.9s;
    }

    .sensor-ring-delay-2 {
      animation-delay: 1.8s;
    }

    /* Floating Sensor Arc Waves */
    @keyframes arcPulse {
      0%, 100% { opacity: 0.45; transform: translate(-50%, -75%) scale(0.96); }
      50% { opacity: 0.95; transform: translate(-50%, -75%) scale(1.04); }
    }

    .sensor-arc {
      animation: arcPulse 2.4s ease-in-out infinite;
    }

    /* Asphalt Laser Sweep Line */
    @keyframes groundSweep {
      0% { transform: translate(-50%, 0) translateY(0) scaleX(0.7); opacity: 0.75; }
      50% { transform: translate(-50%, 0) translateY(20px) scaleX(1.3); opacity: 0.25; }
      100% { transform: translate(-50%, 0) translateY(38px) scaleX(1.7); opacity: 0; }
    }

    .ground-scan-beam {
      animation: groundSweep 2.2s ease-out infinite;
    }

    /* Small subtle breathing pulse for INITIALIZING text */
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .initializing-pulse {
      animation: subtlePulse 1.8s ease-in-out infinite;
    }

    /* ========================================================================= */
    /* PREMIUM DASHBOARD STYLES — GLASSMORPHISM, GLOW, ANIMATIONS               */
    /* ========================================================================= */

    /* Dark Glassmorphism Sidebar */
    .sidebar-dark {
      background: linear-gradient(180deg, #070b14 0%, #0c1322 40%, #0f172a 100%);
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-dark::-webkit-scrollbar { width: 4px; }
    .sidebar-dark::-webkit-scrollbar-track { background: transparent; }
    .sidebar-dark::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    /* Sidebar nav item styles */
    .sidebar-nav-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      transition: all 200ms ease;
      cursor: pointer;
      color: rgba(148, 163, 184, 0.8);
      gap: 10px;
      position: relative;
    }
    .sidebar-nav-item:hover {
      background: rgba(255,255,255,0.05);
      color: rgba(241, 245, 249, 0.95);
    }
    .sidebar-nav-item.active {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.18) 0%, rgba(37, 99, 235, 0.08) 100%);
      color: #38bdf8;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.12), inset 0 0 15px rgba(14, 165, 233, 0.04);
    }
    .sidebar-nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3.5px;
      border-radius: 0 4px 4px 0;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
    }
    .sidebar-nav-item.active-emerald {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18) 0%, rgba(5, 150, 105, 0.08) 100%);
      color: #34d399;
      font-weight: 700;
      border: 1px solid rgba(52, 211, 153, 0.25);
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.12);
    }
    .sidebar-nav-item.active-emerald::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3.5px;
      border-radius: 0 4px 4px 0;
      background: #34d399;
      box-shadow: 0 0 10px #34d399;
    }
    .sidebar-nav-item.active-purple {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.18) 0%, rgba(99, 102, 241, 0.08) 100%);
      color: #c084fc;
      font-weight: 700;
      border: 1px solid rgba(167, 139, 250, 0.25);
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.12);
    }
    .sidebar-nav-item.active-purple::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3.5px;
      border-radius: 0 4px 4px 0;
      background: #c084fc;
      box-shadow: 0 0 10px #c084fc;
    }

    /* Animated Glow KPI Cards */
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(0,119,182,0.08), 0 4px 20px rgba(0,0,0,0.04); }
      50% { box-shadow: 0 0 25px rgba(0,119,182,0.15), 0 4px 25px rgba(0,0,0,0.06); }
    }
    .kpi-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226,232,240,0.6);
      border-radius: 20px;
      padding: 20px;
      transition: all 300ms cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--kpi-color-from, #0077b6), var(--kpi-color-to, #00b4d8));
      opacity: 0;
      transition: opacity 300ms;
    }
    .kpi-card:hover::before { opacity: 1; }
    .kpi-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.08), 0 0 20px var(--kpi-glow, rgba(0,119,182,0.1));
      border-color: var(--kpi-border, rgba(0,119,182,0.2));
    }

    /* Animated gradient border for live data containers */
    @keyframes borderGlow {
      0% { border-color: rgba(0,119,182,0.3); box-shadow: 0 0 8px rgba(0,119,182,0.1); }
      50% { border-color: rgba(0,180,216,0.5); box-shadow: 0 0 18px rgba(0,180,216,0.15); }
      100% { border-color: rgba(0,119,182,0.3); box-shadow: 0 0 8px rgba(0,119,182,0.1); }
    }
    .live-border {
      animation: borderGlow 3s ease-in-out infinite;
    }

    /* Animated number counter effect */
    @keyframes countUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .count-animate {
      animation: countUp 600ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Live metric ticker pulse */
    @keyframes tickerPulse {
      0%, 100% { color: #dc2626; }
      50% { color: #ef4444; text-shadow: 0 0 8px rgba(239,68,68,0.3); }
    }
    .ticker-pulse {
      animation: tickerPulse 2s ease-in-out infinite;
    }

    /* Dashboard dark scrollbar */
    .dark-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .dark-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
    .dark-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
    .dark-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    /* Premium Gradient Header for dashboard sections */
    .dash-header-gradient {
      background: linear-gradient(135deg, #f8fafc 0%, #f0f7ff 50%, #e8f4fd 100%);
      border: 1px solid rgba(0,119,182,0.08);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
    }
    .dash-header-gradient::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0,180,216,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Kanban column header glow */
    .kanban-col-todo { border-top: 3px solid #f59e0b; }
    .kanban-col-progress { border-top: 3px solid #3b82f6; }
    .kanban-col-done { border-top: 3px solid #10b981; }

    /* Glassmorphic table */
    .glass-table {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(226,232,240,0.5);
      border-radius: 20px;
      overflow: hidden;
    }

<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen" x-data="app()" x-init="initApp()">

      <p class="text-xs text-slate-500 mb-6 font-mono leading-relaxed" id="omnisight-error-message">
        An unexpected error occurred while rendering the dashboard.
      </p>
      <div class="flex items-center justify-center space-x-3">
        <button onclick="window.location.reload()" class="px-5 py-2.5 rounded-full bg-[#0077b6] hover:bg-[#006097] text-white text-xs font-semibold shadow-md transition cursor-pointer">
          Reload Dashboard
        </button>
        <button onclick="window.location.href='/'" class="px-5 py-2.5 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold transition cursor-pointer">
          Return Home
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- OMNISIGHT PRODUCTION STARTUP / LOADING SCREEN                             -->
  <!-- ========================================================================= -->
  <div id="omnisight-loader" :class="{ 'fade-out': loaderFading }" x-show="!loaderHidden">

    <div class="loading-stage">
      <!-- High-resolution clean photographic environment with highway & bus -->
      <img src="/omnisight-bg-2x.png"
           alt="OmniSight Infrastructure Highway Environment"
           class="absolute inset-0 w-full h-full object-cover object-center pointer-events-none select-none" />

      <!-- Subtle blue/cyan sensor waves, data signals & scanning effects around the bus -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <!-- Concentric Ground Radar Rings (perspective matched to highway under bus tires) -->
        <div class="sensor-ring"></div>
        <div class="sensor-ring sensor-ring-delay-1"></div>
        <div class="sensor-ring sensor-ring-delay-2"></div>

        <!-- Rooftop Sensor Dome Pulsing Beacon -->
        <div class="absolute" style="left: 80.8%; top: 67.5%; transform: translate(-50%, -50%);">
          <div class="w-3.5 h-3.5 rounded-full bg-cyan-400 opacity-75 blur-xs animate-ping"></div>
          <div class="absolute inset-0 w-2.5 h-2.5 m-auto rounded-full bg-white shadow-[0_0_10px_#00e5ff]"></div>
        </div>

        <!-- SVG Holographic Scanning Arcs around the bus rooftop sensor -->
        <svg class="absolute sensor-arc"
             style="left: 80.8%; top: 67.5%; width: 280px; height: 180px; transform: translate(-50%, -75%);"
             viewBox="0 0 280 180" fill="none">
          <!-- Concentric upward arcs (simulating lidar radar fan) -->
          <path d="M 35,145 A 110,72 0 0,1 245,145" stroke="url(#cyanGlowGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.75" />
          <path d="M 60,145 A 85,52 0 0,1 220,145" stroke="url(#cyanGlowGrad)" stroke-width="2" opacity="0.85" />
          <path d="M 85,145 A 60,34 0 0,1 195,145" stroke="url(#cyanGlowGrad)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.95" />
          <!-- Downward asphalt scanning fan -->
          <polygon points="140,145 65,180 215,180" fill="url(#fanBeamGrad)" opacity="0.35" class="ground-scan-beam" />
          <defs>
            <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0077b6" stop-opacity="0.2" />
              <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.95" />
              <stop offset="70%" stop-color="#00f5d4" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#0077b6" stop-opacity="0.2" />
            </linearGradient>
            <linearGradient id="fanBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6" />
              <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- Minimal Sleek Progress Bar with 68% beside it -->

           style="top: 58.85%; transform: translate(-50%, -50%); width: clamp(280px, 28%, 430px);">

        getApiUrl(path) {
          if (!path) return '';
          if (path.startsWith('http://') || path.startsWith('https://')) {
            return path;
          }
          let baseUrl = '';
          if (typeof window !== 'undefined') {
            if (window.__ENV__ && window.__ENV__.VITE_API_URL && !window.__ENV__.VITE_API_URL.startsWith('%')) {
              baseUrl = window.__ENV__.VITE_API_URL;
            } else if (window.VITE_API_URL && typeof window.VITE_API_URL === 'string' && !window.VITE_API_URL.startsWith('%')) {
              baseUrl = window.VITE_API_URL;
            }
          }
          if (baseUrl && typeof baseUrl === 'string') {
            const cleanBase = baseUrl.replace(/\/+$/, '');
            const cleanPath = path.startsWith('/') ? path : '/' + path;
            return cleanBase + cleanPath;
          }
          return path;
        },

        async parseResponseSafely(res) {
          let text = '';
          try {
            text = await res.text();
          } catch (readErr) {
            return {
              ok: false,
              status: res.status,
              data: null,
              error: 'Unable to read response from server.'
            };
          }

          const trimmed = (text || '').trim();

          if (!trimmed) {
            let msg = 'Empty response received from server.';
            if (res.status === 401) msg = 'Invalid User ID or Password.';
            else if (res.status === 403) msg = 'Access Denied: You do not have permission for this portal.';
            else if (res.status === 404) msg = 'Authentication service endpoint not found (HTTP 404).';
            else if (res.status === 405) msg = 'API method not allowed (HTTP 405). Please verify server deployment.';
            else if (res.status >= 500) msg = 'Server error encountered (HTTP ' + res.status + '). Please try again later.';
            return {
              ok: false,
              status: res.status,
              data: null,
              error: msg
            };
          }

          try {
            const json = JSON.parse(trimmed);
            const isOk = res.ok && json.success !== false;
            return {
              ok: isOk,
              status: res.status,
              data: json,
              error: isOk ? null : (json.error || json.message || 'Request failed.')
            };
          } catch (parseErr) {
            let fallbackMsg = 'Unexpected server response format.';
            if (res.status === 401) fallbackMsg = 'Invalid User ID or Password.';
            else if (res.status === 403) fallbackMsg = 'Access Denied: You do not have permission for this portal.';
            else if (res.status === 404) fallbackMsg = 'Authentication service endpoint not found (HTTP 404).';
            else if (res.status === 405) fallbackMsg = 'API method not allowed (HTTP 405). Please verify API routing.';
            else if (res.status >= 500) fallbackMsg = 'Server error encountered (HTTP ' + res.status + '). Please try again shortly.';
            return {
              ok: false,
              status: res.status,
              data: null,
              error: fallbackMsg
            };
          }
        },

        async fetchWithAuth(url, options = {}) {
          const finalUrl = this.getApiUrl(url);
          const headers = {
            'Content-Type': 'application/json',
            ...(options.headers || {})
          };
          if (this.authToken) {
            headers['Authorization'] = `Bearer ${this.authToken}`;
          }
          const response = await fetch(finalUrl, { ...options, headers });
          if (response.status === 401) {
            this.clearSessionState();
            throw new Error('Session expired. Please sign in again.');
          }
          const parsed = await this.parseResponseSafely(response);
          if (!parsed.ok) {
            throw new Error(parsed.error || ('Request failed with status ' + response.status));
          }
          return parsed.data;
        },

        async verifySession() {
          this.authState = 'AUTH_LOADING';
          try {
            const headers = { 'Content-Type': 'application/json' };
            if (this.authToken) {
              headers['Authorization'] = `Bearer ${this.authToken}`;
            }
            const response = await fetch(this.getApiUrl('/api/auth/me'), { headers });
            if (response.ok) {
              const parsed = await this.parseResponseSafely(response);
              if (parsed.ok && parsed.data && parsed.data.success && parsed.data.user) {
                this.currentUser = parsed.data.user;
                this.authState = 'AUTHENTICATED';
                this.startRoleScopedAlerts(parsed.data.user.role);
                return;
              }
            }
            this.clearSessionState();
          } catch (e) {
            this.clearSessionState();
          }
        },

        clearSessionState() {
          this.currentUser = null;
          this.authToken = null;
          this.authState = 'UNAUTHENTICATED';
          this.toasts = [];
          this.stopRoleScopedAlerts();
          localStorage.removeItem('omnisight_token');
        },

        startStartupSequence() {
          this.isLoading = true;
          this.loaderFading = false;
          this.loaderHidden = false;
          this.loadingProgress = 0;
          this.displayPercent = '0%';

          const startTime = performance.now();
          const MIN_HOLD_MS = 2000; // Strict hold duration: 2.0s (at most 2.5s total including fade)

          const milestones = [
            { t: 0, p: 0 },
            { t: 300, p: 24 },
            { t: 600, p: 48 },
            { t: 900, p: 68 }, // Reference 68% milestone
            { t: 1400, p: 68 }, // Holds at 68%
            { t: 1750, p: 90 },
            { t: 2000, p: 100 }
          ];

          let animFrameId = null;

          const tick = (now) => {
            const elapsed = now - startTime;
            let currentP = 0;
            if (elapsed >= 2000) {
              currentP = 100;
            } else {
              for (let i = 0; i < milestones.length - 1; i++) {
                const m1 = milestones[i];
                const m2 = milestones[i + 1];
                if (elapsed >= m1.t && elapsed <= m2.t) {
                  const factor = (elapsed - m1.t) / (m2.t - m1.t);
                  const ease = factor < 0.5 ? 2 * factor * factor : 1 - Math.pow(-2 * factor + 2, 2) / 2;
                  currentP = m1.p + (m2.p - m1.p) * ease;
                  break;
                }
              }
            }

            this.loadingProgress = Math.min(100, Math.round(currentP));
            this.displayPercent = this.loadingProgress + '%';

            if (elapsed >= MIN_HOLD_MS && this.loadingProgress >= 100) {
              this.loaderFading = true;
              setTimeout(() => {
                this.isLoading = false;
                this.loaderHidden = true;
                this.handleRoute();
              }, 450);
            } else {
              animFrameId = requestAnimationFrame(tick);
            }
          };

          animFrameId = requestAnimationFrame(tick);

          // Hard fallback in case requestAnimationFrame is throttled in background tabs
          setTimeout(() => {
            if (!this.loaderHidden) {
              this.loaderFading = true;
              this.isLoading = false;
              this.loaderHidden = true;
              this.handleRoute();
            }
          }, 3200);

          window.replayStartupLoader = () => {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            this.startStartupSequence();
          };
        },

        triggerLoadingIntro() {
          this.startStartupSequence();
        },

        // ------------------------------------------------------------------
        // Navigation & Multi-Page Routing
        // ------------------------------------------------------------------
        // ------------------------------------------------------------------
        // Centralized Scroll Restoration Control (Always start routes at TOP: X=0, Y=0)
        // ------------------------------------------------------------------
        resetScrollToTop() {
          const performReset = () => {
            if (typeof window !== 'undefined') {
              const root = document.documentElement;
              const prevBehavior = root ? root.style.scrollBehavior : '';
              if (root) root.style.scrollBehavior = 'auto';

              window.scrollTo({
                top: 0,
                left: 0,
                behavior: 'instant'
              });

              if (root) {
                root.scrollTop = 0;
                root.scrollLeft = 0;
              }
              if (document.body) {
                document.body.scrollTop = 0;
                document.body.scrollLeft = 0;
              }

              // Also zero-out any active inner scrollable containers (e.g. dashboard sections, main)
              const scrollables = document.querySelectorAll('main, section, [class*="overflow-y-auto"], .overflow-y-auto');
              scrollables.forEach(el => {
                if (el.scrollTop !== 0) el.scrollTop = 0;
                if (el.scrollLeft !== 0) el.scrollLeft = 0;
              });

              if (root) root.style.scrollBehavior = prevBehavior;
            }
          };

          // 1. Immediate synchronous reset
          performReset();

          // 2. NextTick reset after Alpine conditionally mounts the new view into DOM
          if (this.$nextTick) {
            this.$nextTick(() => {
              performReset();
              requestAnimationFrame(performReset);
            });
          } else {
            requestAnimationFrame(performReset);
          }
        },

        // ------------------------------------------------------------------
        // Single-Entry History Management (Fixes Click Back Twice Issue)
        // ------------------------------------------------------------------
        pushRoute(path, state = {}) {
          if (window.location.pathname === path && !window.location.hash) {
            return;
          }
          if (window.history && window.history.pushState) {
            window.history.pushState(state, '', path);
          } else {
            window.location.hash = '#' + path;
          }
        },

        replaceRoute(path, state = {}) {
          if (window.history && window.history.replaceState) {
            window.history.replaceState(state, '', path);
          }
        },

        navigateTo(view) {
          this.mobileMenuOpen = false;
          this.currentView = view;
          this.showLoginModal = false;
          const pathMap = {
            'landing': '/',
            'about': '/about',
            'features': '/features',
            'impact': '/impact',
            'contact': '/contact',
            'portal-select': '/portal-select'
          };
          const targetPath = pathMap[view] || ('/' + view);
          this.pushRoute(targetPath, { view });
          this.resetScrollToTop();
        },

        handleRoute() {
          const hash = window.location.hash ? window.location.hash.replace(/^#\/?/, '').toLowerCase() : '';
          const pathname = window.location.pathname.replace(/^\//, '').toLowerCase();
          const routeStr = hash || pathname || '';
          const parts = routeStr.split('/');
          const section = parts[0] || '';
          const sub = parts[1] || '';

          // If the user arrived with a hash (e.g. #/about), clean it up with replaceState so it never causes double-back history
          if (hash && window.history && window.history.replaceState) {
            window.history.replaceState({ view: section }, '', '/' + routeStr);
          }

          // 1. Landing (Home)
          if (!section || section === 'landing') {
            this.currentView = 'landing';
            this.activeSection = 'hero';
            this.showLoginModal = false;
            this.resetScrollToTop();
            return;
          }

          // 2. Dedicated Pages
          if (section === 'about') {
            this.currentView = 'about';
            this.showLoginModal = false;
            this.resetScrollToTop();
            return;
          }

          if (section === 'features') {
            this.currentView = 'features';
            this.showLoginModal = false;
            this.resetScrollToTop();
            return;
          }

          if (section === 'impact') {
            this.currentView = 'impact';
            this.showLoginModal = false;
            this.resetScrollToTop();
            return;
          }

          if (section === 'contact') {
            this.currentView = 'contact';
            this.showLoginModal = false;
            this.resetScrollToTop();
            return;
          }

          // 3. Portal Selection Page
          if (section === 'portal-select' || section === 'portals' || section === 'choose-portal') {
            if (this.authState === 'AUTHENTICATED' && this.currentUser) {
              this.redirectToAuthorizedPortal();
            } else {
              this.currentView = 'portal-select';
              this.showLoginModal = false;
              this.resetScrollToTop();
            }
            return;
          }

          // 4. Direct Login Links (Individual Portal Login)
          if (section === 'login') {
            if (this.authState === 'AUTHENTICATED' && this.currentUser) {
              this.redirectToAuthorizedPortal();
            } else {
              const target = (sub === 'dev' || sub === 'developer') ? 'dev' : (sub === 'ward' ? 'ward' : 'city');
              this.pendingTargetView = target;
              this.loginTargetTitle = target === 'city' ? 'City Official Portal' : (target === 'ward' ? 'Ward Jurisdiction Portal' : 'Developer Diagnostics Portal');
              this.loginError = '';
              this.fillUnifiedDemo(target);
              this.currentView = 'login';
              this.showLoginModal = false;
              this.resetScrollToTop();
            }
            return;
          }

          // 5. Protected Portal: City
          if (section === 'city') {
            if (this.authState !== 'AUTHENTICATED' || !this.currentUser) {
              this.navigateToPortalSelect();
              this.openLogin('city');
              return;
            }
            if (this.currentUser.role !== 'CITY') {
              this.redirectToAuthorizedPortal();
              return;
            }
            this.currentView = 'city';
            if (sub === 'map') this.cityTab = 'economic';
            else if (sub === 'hazards' || sub === 'budget') this.cityTab = 'budget';
            else if (sub === 'analytics' || sub === 'economic') this.cityTab = 'economic';
            else if (sub === 'leaderboard') this.cityTab = 'leaderboard';
            this.loadPortalData('city');
            this.resetScrollToTop();
            return;
          }

          // 6. Protected Portal: Ward
          if (section === 'ward') {
            if (this.authState !== 'AUTHENTICATED' || !this.currentUser) {
              this.navigateToPortalSelect();
              this.openLogin('ward');
              return;
            }
            if (this.currentUser.role !== 'WARD') {
              this.redirectToAuthorizedPortal();
              return;
            }
            this.currentView = 'ward';
            if (sub === 'incidents' || sub === 'kanban') this.wardTab = 'kanban';
            else if (sub === 'map' || sub === 'triage') this.wardTab = 'triage';
            else if (sub === 'repairs' || sub === 'verification') this.wardTab = 'verification';
            else if (sub === 'settings') this.wardTab = 'settings';
            this.loadPortalData('ward');
            this.resetScrollToTop();
            return;
          }

          // 7. Protected Portal: Developer
          if (section === 'developer' || section === 'dev') {
            if (this.authState !== 'AUTHENTICATED' || !this.currentUser) {
              this.navigateToPortalSelect();
              this.openLogin('dev');
              return;
            }
            if (this.currentUser.role !== 'DEVELOPER') {
              this.redirectToAuthorizedPortal();
              return;
            }
            this.currentView = 'dev';
            if (sub === 'devices' || sub === 'fleet') this.devTab = 'fleet';
            else if (sub === 'telemetry' || sub === 'diagnostics') this.devTab = 'diagnostics';
            else if (sub === 'system' || sub === 'bandwidth') this.devTab = 'bandwidth';
            else if (sub === 'settings') this.devTab = 'settings';
            else if (sub === 'logs') this.devTab = 'logs';
            else if (sub === 'hardware' || sub === 'mgmt') this.devTab = 'devices';
            else if (sub === 'api') this.devTab = 'api';
            this.loadPortalData('dev');
            this.resetScrollToTop();
            return;
          }

          this.currentView = 'landing';
          this.resetScrollToTop();
        },

        redirectToAuthorizedPortal() {
          if (!this.currentUser) {
            this.navigateLanding();
            return;
          }
          if (this.currentUser.role === 'CITY') {
            this.currentView = 'city';
            this.pushRoute('/city', { view: 'city' });
            this.loadPortalData('city');
          } else if (this.currentUser.role === 'WARD') {
            this.currentView = 'ward';
            this.pushRoute('/ward', { view: 'ward' });
            this.loadPortalData('ward');
          } else if (this.currentUser.role === 'DEVELOPER') {
            this.currentView = 'dev';
            this.pushRoute('/developer', { view: 'dev' });
            this.loadPortalData('dev');
          }
          this.resetScrollToTop();
        },

        setWardTab(tab) {

        get selectedBus() {
          return this.selectedDevBus || this.fleetNodes[2] || this.fleetNodes[0];

        get filteredWardHazards() {
          let list = [...this.wardHazardsList];
          if (this.wardSeverityFilter && this.wardSeverityFilter !== 'ALL') {
            list = list.filter(h => h.severity.toUpperCase() === this.wardSeverityFilter.toUpperCase() || h.severityLevel === this.wardSeverityFilter);
          }
          if (this.wardStatusFilter && this.wardStatusFilter !== 'ALL') {
            list = list.filter(h => h.status.toUpperCase() === this.wardStatusFilter.toUpperCase());
          }
          if (this.wardSelectedCorridor && this.wardSelectedCorridor !== 'ALL') {
            list = list.filter(h => h.corridor === this.wardSelectedCorridor);
          }
          if (this.wardSearchQuery && this.wardSearchQuery.trim()) {
            const q = this.wardSearchQuery.toLowerCase().trim();
            list = list.filter(h =>
              h.id.toLowerCase().includes(q) ||
              h.location.toLowerCase().includes(q) ||
              h.issue.toLowerCase().includes(q) ||
              h.assigned.toLowerCase().includes(q)
            );
          }
          return list;
        },

        get filteredFleetNodes() {
          let list = [...this.fleetNodes];

          // 1. Status Filter
          if (this.fleetStatusFilter === 'online') {
            list = list.filter(b => b.online);
          } else if (this.fleetStatusFilter === 'offline') {
            list = list.filter(b => !b.online);
          }

          // 2. Health Filter
          if (this.fleetHealthFilter && this.fleetHealthFilter !== 'all') {
            if (this.fleetHealthFilter === 'optimal') {
              list = list.filter(b => b.online && b.jetsonTemp < 60 && b.sqliteUsage < 50);
            } else if (this.fleetHealthFilter === 'warning') {
              list = list.filter(b => b.online && (b.jetsonTemp >= 60 || b.sqliteUsage >= 50 || b.lteDbm < -80));
            } else if (this.fleetHealthFilter === 'offline') {
              list = list.filter(b => !b.online);
            }
          }

          // 3. Route Filter
          if (this.fleetRouteFilter && this.fleetRouteFilter !== 'all') {
            list = list.filter(b => b.route.toLowerCase().includes(this.fleetRouteFilter.toLowerCase()));
          }

          // 4. Search Query
          if (this.fleetSearchQuery.trim()) {
            const q = this.fleetSearchQuery.toLowerCase().trim();
            list = list.filter(b =>
              b.busNumber.toLowerCase().includes(q) ||
              b.route.toLowerCase().includes(q) ||
              (b.id && b.id.toLowerCase().includes(q))
            );
          }

          // 5. Sort Field
          if (this.fleetSortBy === 'busNumber') {
            list.sort((a, b) => a.busNumber.localeCompare(b.busNumber, undefined, { numeric: true }));
          } else if (this.fleetSortBy === 'camFps') {
            list.sort((a, b) => b.camFps - a.camFps);
          } else if (this.fleetSortBy === 'jetsonTemp') {
            list.sort((a, b) => a.jetsonTemp - b.jetsonTemp);
          } else if (this.fleetSortBy === 'sqliteUsage') {
            list.sort((a, b) => a.sqliteUsage - b.sqliteUsage);
          } else if (this.fleetSortBy === 'lteDbm') {
            list.sort((a, b) => b.lteDbm - a.lteDbm);
          } else if (this.fleetSortBy === 'uptime') {
            list.sort((a, b) => b.uptime.localeCompare(a.uptime));
          }

          return list;
        },

        navigateToPortalSelect() {

        async submitContact() {
          this.contactError = '';
          this.contactSuccess = false;

          // Required field validations
          if (!this.contactForm.name || !this.contactForm.name.trim()) {
            this.contactError = 'Please enter your full name.';
            return;
          }
          if (!this.contactForm.email || !this.contactForm.email.trim()) {
            this.contactError = 'Please enter your work or organization email address.';
            return;
          }
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(this.contactForm.email.trim())) {
            this.contactError = 'Please provide a valid email address (e.g. name@department.gov.in).';
            return;
          }
          // Provide clean fallback defaults for organization & subject if omitted in simplified form
          if (!this.contactForm.organization || !this.contactForm.organization.trim()) {
            this.contactForm.organization = 'Municipal Deployment Inquiry';
          }
          if (!this.contactForm.subject || !this.contactForm.subject.trim()) {
            this.contactForm.subject = 'Civic Infrastructure Deployment';
          }
          if (!this.contactForm.message || !this.contactForm.message.trim()) {
            this.contactError = 'Please enter your message or technical inquiry.';
            return;
          }

          this.contactSubmitting = true;

          try {
            const res = await fetch(this.getApiUrl('/api/contact'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name: this.contactForm.name.trim(),
                email: this.contactForm.email.trim(),
                organization: this.contactForm.organization.trim(),
                subject: this.contactForm.subject.trim(),
                message: this.contactForm.message.trim()
              })
            });

            const parsed = await this.parseResponseSafely(res);
            if (!parsed.ok) {
              throw new Error(parsed.error || 'Failed to submit inquiry. Please try again.');
            }

            const data = parsed.data;
            this.contactSuccess = true;
            this.contactInquiryId = data?.inquiryId || ('INQ-' + Date.now().toString(36).toUpperCase());
            this.contactForm = {
              name: '',
              email: '',
              organization: '',
              subject: '',
              message: ''
            };
          } catch (err) {
            console.error('[Contact Error]', err);
            this.contactError = err.message || 'Unable to submit your message at this time. Please check your connection and try again.';
          } finally {
            this.contactSubmitting = false;
          }
        },

        async submitLogin() {
          if (this.isAuthenticating) return; // Prevent double-submit

          if (!this.loginForm.username || !this.loginForm.password) {
            this.loginError = 'Please enter both User ID and Password.';
            return;
          }

          this.isAuthenticating = true;
          this.loginError = '';

          try {
            const targetPortal = this.pendingTargetView === 'dev' ? 'developer' : this.pendingTargetView;
            const res = await fetch(this.getApiUrl('/api/auth/login'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: this.loginForm.username.trim(),
                password: this.loginForm.password,
                portal: targetPortal
              })
            });

            const parsed = await this.parseResponseSafely(res);
            if (!parsed.ok || !parsed.data || !parsed.data.success) {
              this.loginError = parsed.error || 'Invalid User ID or Password.';
              this.isAuthenticating = false;
              return;
            }

            const data = parsed.data;
            this.authToken = data.token;
            localStorage.setItem('omnisight_token', data.token);
            this.currentUser = data.user;
            this.authState = 'AUTHENTICATED';
            this.showLoginModal = false;
            this.isAuthenticating = false;

            // Start role-scoped alerts strictly for authorized user role
            this.startRoleScopedAlerts(data.user.role);

            // One-time Authenticated toast displayed immediately after interactive login
            this.addToast('✅ Authenticated', `Signed in as ${data.user.fullName} (${data.user.role})`, 'L3');

            // Dynamic role-based redirection to authorized dashboard
            if (data.user.role === 'CITY') {
              this.currentView = 'city';
              this.pushRoute('/city', { view: 'city' });
              await this.loadPortalData('city');
            } else if (data.user.role === 'WARD') {
              this.currentView = 'ward';
              this.pushRoute('/ward', { view: 'ward' });
              await this.loadPortalData('ward');
            } else if (data.user.role === 'DEVELOPER') {
              this.currentView = 'dev';
              this.pushRoute('/developer', { view: 'dev' });
              await this.loadPortalData('dev');
            } else {
              this.currentView = 'landing';
              this.pushRoute('/', { view: 'landing' });
            }
            this.resetScrollToTop();
          } catch (e) {
            console.error('[Login Connection Error]', e);
            this.loginError = 'Unable to connect to the authentication service. Please try again.';
            this.isAuthenticating = false;
          }
        },

        async logout() {
          try {

          } catch (e) {}
          this.clearSessionState();
          this.currentView = 'landing';
          this.activeSection = 'hero';

        navigateLanding() {

          this.currentView = 'landing';
          this.activeSection = 'hero';
          this.showLoginModal = false;
          this.pushRoute('/', { view: 'landing' });

        },

        // ------------------------------------------------------------------
        // Portal Data Loaders
        // ------------------------------------------------------------------
        async loadPortalData(view) {
          if (view === 'city') {
            await this.loadCityData();
            this.$nextTick(() => {
              this.initChennaiMap();

        async loadCityData() {
          try {
            const [dash, budget, roads, hazards] = await Promise.all([
              this.fetchWithAuth('/api/city/dashboard').catch(() => null),
              this.fetchWithAuth('/api/city/budget').catch(() => null),
              this.fetchWithAuth('/api/city/roads').catch(() => null),
              this.fetchWithAuth('/api/city/hazards').catch(() => null)
            ]);

            if (dash && dash.success && dash.data) {
              if (typeof dash.data.societalDrain === 'number') this.societalDrain = dash.data.societalDrain;
              if (Array.isArray(dash.data.leaderboard)) this.leaderboard = dash.data.leaderboard;
            }
            if (budget && budget.success && Array.isArray(budget.data)) {
              this.budgetItems = budget.data;
              this.totalApprovedBudget = this.budgetItems
                .filter(b => b?.status === 'APPROVED')
                .reduce((acc, b) => acc + (b?.repairCost || 0), 0);
            }
            if (roads && roads.success && Array.isArray(roads.data)) this.cityRoads = roads.data;
            if (hazards && hazards.success && Array.isArray(hazards.data)) this.cityHazards = hazards.data;
          } catch (e) {
            console.error('Error loading city data:', e);
          }
        },

        async loadWardData() {
          try {
            const [dash, incs] = await Promise.all([
              this.fetchWithAuth('/api/ward/dashboard').catch(() => null),
              this.fetchWithAuth('/api/ward/incidents').catch(() => null)
            ]);
            if (dash && dash.success && dash.data) {
              if (dash.data.ward) this.selectedWard = { ...this.selectedWard, ...dash.data.ward };
              if (typeof dash.data.activeHazards === 'number') this.wardActiveHazards = dash.data.activeHazards;
              if (typeof dash.data.l1Count === 'number') this.wardL1Count = dash.data.l1Count;
              if (typeof dash.data.resolvedCount === 'number') this.wardResolvedCount = dash.data.resolvedCount;
            }
            if (incs && incs.success && Array.isArray(incs.data) && incs.data.length > 0) {
              this.kanbanCards = incs.data;
            }
          } catch (e) {
            console.error('Error loading ward data:', e);
          }
        },

        async loadDeveloperData() {
          try {
            const [devices, telemetry] = await Promise.all([
              this.fetchWithAuth('/api/developer/devices').catch(() => null),
              this.fetchWithAuth('/api/developer/telemetry').catch(() => null)
            ]);
            if (devices && devices.success && Array.isArray(devices.data)) this.fleetNodes = devices.data;
            if (telemetry && telemetry.success && Array.isArray(telemetry.data) && telemetry.data.length > 0) {
              this.diagnosticLogs = telemetry.data.map(t =>
                `[${new Date(t.timestamp).toTimeString().split(' ')[0]}] [${t.device?.vehicle?.vehicleNumber ? 'BUS#' + t.device.vehicle.vehicleNumber : 'NODE'}] [TELEMETRY] Ax: ${t.axG}g, Ay: ${t.ayG}g, Az: ${t.azG}g | GPS: ${t.latitude ? t.latitude.toFixed(4) : '0.0000'}, ${t.longitude ? t.longitude.toFixed(4) : '0.0000'} | Conf: ${t.visionConfidence ?? 'N/A'}`
              );
            }
          } catch (e) {
            console.error('Error loading dev data:', e);
          }
        },

        // ------------------------------------------------------------------
        // Leaflet Interactive Map Engine
        // ------------------------------------------------------------------
        initChennaiMap() {
          const mapEl = document.getElementById('chennai-map');
          if (!mapEl || typeof L === 'undefined') return;

          if (this.leafletMap) {
            try {
              if (this.leafletMap.getContainer() !== mapEl || !document.body.contains(this.leafletMap.getContainer())) {
                this.leafletMap.remove();
                this.leafletMap = null;
              } else {
                setTimeout(() => {
                  try { if (this.leafletMap) this.leafletMap.invalidateSize(); } catch(e) {}
                }, 150);
                return;
              }
            } catch (e) {
              this.leafletMap = null;
            }
          }

          if (mapEl._leaflet_id) {
            mapEl._leaflet_id = null;
          }

          try {
            this.leafletMap = L.map('chennai-map', {
              zoomControl: true,
              scrollWheelZoom: false
            }).setView([13.044, 80.250], 12);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
              attribution: '© OpenStreetMap contributors, © CARTO',
              maxZoom: 18
            }).addTo(this.leafletMap);

            this.renderMapEntities();
            setTimeout(() => {
              try { if (this.leafletMap) this.leafletMap.invalidateSize(); } catch(e) {}
            }, 250);
          } catch (err) {
            console.warn('[Map Init]', err);
          }
        },

        renderMapEntities() {
          if (!this.leafletMap || typeof L === 'undefined') return;

          try {
            if (Array.isArray(this.mapMarkers)) {
              this.mapMarkers.forEach(m => { try { this.leafletMap.removeLayer(m); } catch(e) {} });
            }
            if (Array.isArray(this.mapPolylines)) {
              this.mapPolylines.forEach(p => { try { this.leafletMap.removeLayer(p); } catch(e) {} });
            }
          } catch(e) {}
          this.mapMarkers = [];
          this.mapPolylines = [];

          // 1. Draw Chennai Road Segment Corridors
          const roadCorridors = [
            {
              name: 'Anna Salai (DMS Junction)',
              coords: [[13.0604, 80.2600], [13.0441, 80.2502], [13.0300, 80.2350]],
              color: '#dc2626',
              drain: '₹2,84,000 / day',
              status: 'Critical High Drain'
            },
            {
              name: 'LB Road Adyar Signal Corridor',
              coords: [[13.0034, 80.2551], [13.0078, 80.2589], [13.0112, 80.2620]],
              color: '#dc2626',
              drain: '₹1,95,000 / day',
              status: 'Critical L1 Depressions'
            },
            {
              name: 'Poonamallee High Road',
              coords: [[13.0784, 80.2411], [13.0750, 80.2200], [13.0720, 80.2000]],
              color: '#dc2626',
              drain: '₹3,12,000 / day',
              status: 'Critical Waterlogged'
            },
            {
              name: 'Old Mahabalipuram Road (OMR)',
              coords: [[12.9880, 80.2450], [12.9500, 80.2380], [12.9010, 80.2279]],
              color: '#10b981',
              drain: '₹12,000 / day',
              status: 'Certified Restored (99.8%)'
            },
            {
              name: 'Kamarajar Salai (Marina Promenade)',
              coords: [[13.0500, 80.2820], [13.0400, 80.2800], [13.0300, 80.2780]],
              color: '#10b981',
              drain: '₹8,000 / day',
              status: 'Certified Smooth'
            }
          ];

          roadCorridors.forEach(rc => {
            const poly = L.polyline(rc.coords, {
              color: rc.color,
              weight: 5,
              opacity: 0.8
            }).addTo(this.leafletMap);

            poly.bindTooltip(`<b>${rc.name}</b><br>Drain: ${rc.drain}<br>Status: ${rc.status}`);
            this.mapPolylines.push(poly);
          });

          // 2. Draw Filtered Hazard Markers
          const hazards = this.cityHazards.length > 0 ? this.cityHazards : [
            { id: 'haz-1', hazardCode: 'HAZ-1049', type: 'CRATER', severity: 'L1', latitude: 13.0034, longitude: 80.2551, depthCm: 15.0, spikeG: 3.95, confidenceScore: 0.98, road: { name: 'LB Road' }, ward: { name: 'Zone 13 Adyar' } },
            { id: 'haz-2', hazardCode: 'HAZ-1050', type: 'POTHOLE', severity: 'L2', latitude: 13.0112, longitude: 80.2344, depthCm: 8.5, spikeG: 2.65, confidenceScore: 0.94, road: { name: 'Sardar Patel Rd' }, ward: { name: 'Zone 13 Adyar' } },
            { id: 'haz-3', hazardCode: 'HAZ-1051', type: 'SURFACE_RAVELLING', severity: 'L3', latitude: 13.0078, longitude: 80.2589, depthCm: 4.2, spikeG: 1.85, confidenceScore: 0.91, road: { name: 'Gandhi Nagar' }, ward: { name: 'Zone 13 Adyar' } },
            { id: 'haz-6', hazardCode: 'HAZ-1054', type: 'CRATER', severity: 'L1', latitude: 13.0441, longitude: 80.2502, depthCm: 14.2, spikeG: 3.82, confidenceScore: 0.98, road: { name: 'Anna Salai' }, ward: { name: 'Zone 9 Teynampet' } },
            { id: 'haz-7', hazardCode: 'HAZ-1055', type: 'WATERLOGGING', severity: 'L2', latitude: 13.0784, longitude: 80.2411, depthCm: 12.8, spikeG: 3.41, confidenceScore: 0.95, road: { name: 'Poonamallee High Rd' }, ward: { name: 'Zone 8 Anna Nagar' } },
            { id: 'haz-8', hazardCode: 'HAZ-1056', type: 'CRATER', severity: 'L1', latitude: 13.0692, longitude: 80.1942, depthCm: 13.9, spikeG: 3.65, confidenceScore: 0.97, road: { name: 'Jawaharlal Nehru Rd' }, ward: { name: 'Zone 10 Kodambakkam' } }
          ];

          hazards.forEach(h => {
            if (this.mapFilters.severity !== 'ALL' && h.severity !== this.mapFilters.severity) return;
            if (this.mapFilters.type !== 'ALL' && h.type !== this.mapFilters.type) return;

            const color = h.severity === 'L1' ? '#dc2626' : (h.severity === 'L2' ? '#f59e0b' : '#2563eb');
            const marker = L.circleMarker([h.latitude, h.longitude], {
              radius: h.severity === 'L1' ? 8 : 6,
              fillColor: color,
              color: '#ffffff',
              weight: 2,
              opacity: 1,
              fillOpacity: 0.9
            }).addTo(this.leafletMap);

            marker.bindTooltip(`<b>${h.hazardCode} (${h.severity})</b><br>${h.type} • Depth ${h.depthCm || 12}cm<br>Click to inspect`);
            marker.on('click', () => {
              this.selectedHazard = h;
            });

            this.mapMarkers.push(marker);
          });

          // 3. Draw Active Edge Buses
          const buses = [
            { number: '47', lat: 13.0034, lng: 80.2551, route: 'Adyar ⇄ Broadway', fps: 30.0 },
            { number: '19B', lat: 13.0784, lng: 80.2411, route: 'T.Nagar ⇄ Kelambakkam', fps: 29.8 },
            { number: '29C', lat: 13.0112, lng: 80.2344, route: 'Perambur ⇄ Besant Nagar', fps: 30.0 }
          ];

          buses.forEach(b => {
            const busIcon = L.divIcon({
              className: 'bus-pin-marker',
              html: `<div style="background:#00b4d8;color:#0c1f44;font-size:9px;font-weight:bold;padding:2px 5px;border-radius:3px;border:1.5px solid #ffffff;box-shadow:0 2px 6px rgba(0,0,0,0.3);white-space:nowrap;">🚌 #${b.number}</div>`,
              iconSize: [42, 20],
              iconAnchor: [21, 10]
            });

            const busMarker = L.marker([b.lat, b.lng], { icon: busIcon }).addTo(this.leafletMap);
            busMarker.bindTooltip(`<b>MTC Bus #${b.number}</b><br>${b.route}<br>Edge Vision: ${b.fps} FPS`);
            this.mapMarkers.push(busMarker);
          });
        },

        applyMapFilters() {
          this.renderMapEntities();
        },

        resetMapFilters() {
          this.mapFilters = { severity: 'ALL', type: 'ALL' };
          this.renderMapEntities();
        },

        // ------------------------------------------------------------------
        // City Portal Actions
        // ------------------------------------------------------------------
        async approveBudget(item) {
          try {
            const res = await this.fetchWithAuth(`/api/city/budget/${item.id}/approve`, {
              method: 'PATCH'
            });
            if (res.success) {
              item.status = 'APPROVED';
              this.totalApprovedBudget += item.repairCost;
              this.addToast('✅ Budget Disbursed', `Disbursed ₹${item.repairCost.toLocaleString('en-IN')} for ${item.location}`, 'L3');
            }
          } catch (e) {
            this.addToast('Error', e.message, 'L1');
          }
        },

        saveMacroParams() {
          this.addToast('Variables Updated', `Petrol: ₹${this.fuelParams.petrol}/L • Diesel: ₹${this.fuelParams.diesel}/L`, 'L3');
        },

        downloadCompliancePDF() {
          const content = `GREATER CHENNAI CORPORATION - MONTHLY ROAD COMPLIANCE CERTIFICATE\nDate: ${new Date().toISOString()}\nDaily Societal Drain: ₹${this.societalDrain.toLocaleString('en-IN')}\nStatus: VERIFIED\nSigned: Municipal Commissioner, Chennai`;
          const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'GCC_Monthly_Road_Compliance_Certificate.pdf';
          a.click();
          URL.revokeObjectURL(url);
          this.addToast('PDF Downloaded', 'Compliance certificate saved to downloads.', 'L3');
        },

        exportDataCSV() {
          let csv = 'ClusterID,Location,Coordinates,Ward,RepairCostINR,DrainCostINR,ROI,Status\n';
          this.budgetItems.forEach(i => {
            csv += `"${i.id}","${i.location}","${i.coords}","${i.ward}",${i.repairCost},${i.drainCost},${i.roi},"${i.status}"\n`;
          });
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'GCC_30m_Road_Segments_Database.csv';
          a.click();
          URL.revokeObjectURL(url);
          this.addToast('CSV Exported', '30m segments database exported.', 'L3');
        },

        // ------------------------------------------------------------------
        // Ward Portal Actions
        // ------------------------------------------------------------------
        async dispatchL1Crew(hazardId) {
          try {
            const res = await this.fetchWithAuth('/api/ward/dispatch', {
              method: 'POST',
              body: JSON.stringify({ hazardCode: hazardId })
            });
            if (res.success) {
              this.addToast('🚨 Rapid Patch Dispatched', `${res.message} (Ticket: ${res.ticketNumber})`, 'L1');
              await this.loadWardData();
            }
          } catch (e) {
            this.addToast('Dispatch Error', e.message, 'L1');
          }
        },

        createKanbanFromHazard(title, hazardId, priority) {
          const newId = 'WO-' + Math.floor(1000 + Math.random() * 9000);
          this.kanbanCards.unshift({
            id: newId,
            title: title,
            type: priority === 'L1' ? 'Single Pothole' : (priority === 'L2' ? '30m Cluster' : 'Surface Ravelling'),
            contractor: 'Coromandel Infra',
            priority: priority,
            col: 'todo'
          });
          this.wardTab = 'kanban';
          this.addToast('Ticket Created', `Work order ${newId} queued in Kanban.`, 'L3');
        },

        addCustomKanban() {
          const title = prompt('Enter Work Order Title:', 'Sardar Patel Road Edge Trench Repair');
          if (!title) return;
          const newId = 'WO-' + Math.floor(1000 + Math.random() * 9000);
          this.kanbanCards.unshift({
            id: newId,
            title: title,
            type: 'Manual Work Order',
            contractor: 'South Madras Works',
            priority: 'L2',
            col: 'todo'
          });
          this.addToast('Work Order Added', `Created ${newId}`, 'L3');
        },

        async moveKanban(ticketId, targetCol) {
          const item = this.kanbanCards.find(c => c.id === ticketId);
          if (item) item.col = targetCol;

          try {
            await this.fetchWithAuth(`/api/ward/incidents/${ticketId}/status`, {
              method: 'PATCH',
              body: JSON.stringify({ targetCol })
            });
          } catch (e) {
            console.warn('Status change local only:', e);
          }
        },

        simulateVerificationUpload(isValid) {
          this.verificationLogs = [
            `[${new Date().toTimeString().split(' ')[0]}] [UPLOAD] Received binary stream: IMG_20260923_143521.RAW (14.2 MB)`,
            `[EXIF-EXTRACT] Camera: Samsung Galaxy S25 Enterprise Ed.`,
            `[EXIF-EXTRACT] Timestamp: 2026-09-23T14:35:19.420 IST (Freshness: 6 seconds ago)`,
            `[GEO-CALC] Smartphone GPS: ${isValid ? '13.003438° N, 80.255152° E' : '13.003850° N, 80.255590° E'}`,
            `[GEO-CALC] Bus #47 Benchmark: 13.003420° N, 80.255140° E`,
            `[HAVERSINE-MATH] Spatial Distance Delta: ${isValid ? '3.42 meters' : '48.60 meters'}`
          ];

          if (isValid) {
            this.verificationLogs.push(`[TOLERANCE-CHECK] 3.42m \u2264 10.0m threshold -> PASSED`);
            this.verificationLogs.push(`[AI-IMAGE-DIFF] Pre-repair vs Post-repair Bitumen texture match: 97.4%`);
            this.verificationLogs.push(`[STATUS] TICKET AUDIT VERIFICATION PASSED.`);
            this.verificationVerdict = 'PASSED';
          } else {
            this.verificationLogs.push(`[TOLERANCE-CHECK] 48.60m > 10.0m threshold -> REJECTED (GEO-FENCE BREACH)`);
            this.verificationLogs.push(`[FRAUD-ALERT] Photo location does not match physical road pothole crater.`);
            this.verificationLogs.push(`[STATUS] TICKET CLOSEOUT REJECTED.`);
            this.verificationVerdict = 'REJECTED';
          }
        },

        async commitVerification() {
          try {
            await this.fetchWithAuth('/api/ward/verify', {
              method: 'POST',
              body: JSON.stringify({
                ticketNumber: this.verificationTicketId,
                verdict: 'PASSED',
                geoDelta: 3.42,
                textureMatch: 97.4
              })
            });
            this.addToast('✅ Verification Signed', 'Contractor payout unlocked. Road marked GREEN on city map.', 'L3');
            this.verificationVerdict = 'CLOSED';
            const card = this.kanbanCards.find(c => c.id === this.verificationTicketId);
            if (card) card.col = 'done';
          } catch (e) {
            this.addToast('Error', e.message, 'L1');
          }
        },

        // ------------------------------------------------------------------
        // Developer Portal Actions
        // ------------------------------------------------------------------
        clearDiagnostics() {
          this.diagnosticLogs = [
            `[${new Date().toTimeString().split(' ')[0]}] Diagnostics buffer reset by root engineer.`
          ];
        },

        async forcePurgeSQLite() {
          try {
            const res = await this.fetchWithAuth('/api/developer/vacuum', { method: 'POST' });
            this.addToast('🧹 Fleet VACUUM Done', res.message, 'L3');
            this.fleetNodes.forEach(n => {
              n.sqliteUsage = Math.floor(n.sqliteUsage * 0.4);
            });
          } catch (e) {
            this.addToast('Error', e.message, 'L1');
          }
        },

        async broadcastFilterParams() {
          try {
            const res = await this.fetchWithAuth('/api/developer/firmware', {
              method: 'POST',
              body: JSON.stringify(this.filterParams)
            });
            this.addToast('📡 Firmware Broadcast', res.message, 'L3');
          } catch (e) {
            this.addToast('Error', e.message, 'L1');
          }
        },

        // ------------------------------------------------------------------
        // Clock, Simulation & Toasts
        // ------------------------------------------------------------------
        startClock() {
          const update = () => {
            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const dayName = days[now.getDay()];
            const day = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            this.clockString = `${dayName}, ${day} ${month} ${year} | ${h}:${m}:${s} IST`;
          };
          update();
          setInterval(update, 1000);
        },

        startTickerIncrement() {
          setInterval(() => {
            this.societalDrain += Math.floor(Math.random() * 45) + 10;
          }, 1500);
        },

        startL1Countdown() {
          setInterval(() => {
            if (this.l1TimerSeconds > 0) {
              this.l1TimerSeconds--;
              const hrs = String(Math.floor(this.l1TimerSeconds / 3600)).padStart(2, '0');
              const mins = String(Math.floor((this.l1TimerSeconds % 3600) / 60)).padStart(2, '0');
              const secs = String(this.l1TimerSeconds % 60).padStart(2, '0');
              this.l1TimerString = `${hrs}:${mins}:${secs}`;
            }
          }, 1000);
        },

        stopRoleScopedAlerts() {
          if (this.alertIntervalId) {
            clearInterval(this.alertIntervalId);
            this.alertIntervalId = null;
          }
        },

        startRoleScopedAlerts(role) {
          this.stopRoleScopedAlerts();
          if (this.authState !== 'AUTHENTICATED' || !this.currentUser) return;

          let alerts = [];
          if (role === 'CITY') {
            // City-wide infrastructure & arterial alerts
            alerts = [
              { title: "🔴 L1 Alert: Severe Arterial Crater", desc: "Anna Salai (13.0604° N, 80.2600° E) by Bus #47", meta: "Vertical Spike: 3.82G • Depth: 14.2cm • Zone 9", level: "L1" },
              { title: "🔴 L1 Alert: Corridor Depression Flagged", desc: "Poonamallee High Rd (13.0784° N, 80.2411° E) by Bus #19B", meta: "Vertical Spike: 3.41G • Depth: 12.8cm • Zone 8", level: "L1" },
              { title: "🟠 L2 Alert: Surface Deterioration", desc: "Jawaharlal Nehru Rd (13.0692° N, 80.1942° E) by Bus #21G", meta: "Vertical Spike: 2.75G • Depth: 7.4cm • Zone 10", level: "L2" }
            ];
          } else if (role === 'WARD') {
            // Alerts relevant to the user's assigned ward (Adyar Zone 13)
            alerts = [
              { title: "🔴 L1 Alert: Zone 13 Arterial Hazard", desc: "LB Road Adyar (13.0034° N, 80.2551° E) by Bus #29C", meta: "Vertical Spike: 3.95G • Depth: 15.0cm • Zone 13 Adyar", level: "L1" },
              { title: "🟠 L2 Alert: Local Ward Pothole Cluster", desc: "Sardar Patel Rd (13.0071° N, 80.2425° E) by Bus #47", meta: "Vertical Spike: 2.61G • Depth: 8.1cm • Zone 13 Adyar", level: "L2" },
              { title: "🟡 L3 Alert: Faded Crosswalk Indicator", desc: "Gandhi Nagar 3rd Cross (13.0089° N, 80.2510° E) by Bus #29C", meta: "Contrast Index: 38% • Zone 13 Adyar", level: "L3" }
            ];
          } else if (role === 'DEVELOPER') {
            // Technical / edge device / telemetry alerts
            alerts = [
              { title: "📡 Edge Fleet Sync Complete", desc: "Bus #47 Jetson Orin Nano connected via 4G LTE", meta: "SQLite 38% • Jetson Temp: 54°C • FPS: 30.0", level: "L3" },
              { title: "⚠️ Sensor Fusion Disparity Flagged", desc: "Bus #19B IMU vs Vision Discrepancy", meta: "Dynamic Object Suppressed • Confidence: 94%", level: "L2" },
              { title: "🔴 Depot AP Disconnect Warning", desc: "Bus #05 Packet latency high (> 450ms)", meta: "LTE: -81 dBm • Firmware: v2.4.1", level: "L1" }
            ];
          }

          if (alerts.length === 0) return;

          let idx = 0;
          this.alertIntervalId = setInterval(() => {
            if (this.authState !== 'AUTHENTICATED') {
              this.stopRoleScopedAlerts();
              return;
            }
            const template = alerts[idx % alerts.length];
            this.addToast(template.title, template.desc, template.level, template.meta);
            idx++;
          }, 15000);
        },

        addToast(title, desc, level = 'L3', meta = '') {
          // Strictly prevent adding any toast if user is unauthenticated
          if (this.authState !== 'AUTHENTICATED') return;

          const time = new Date().toTimeString().split(' ')[0];
          const id = this.toastCounter++;
          const toast = {
            id,
            title,
            desc,
            meta,
            level,
            time
          };
          this.toasts.unshift(toast);
          if (this.toasts.length > 3) this.toasts.pop();

          // Auto-dismiss toasts after 7 seconds
          setTimeout(() => {
            this.removeToast(id);
          }, 7000);
        },

        removeToast(id) {
          this.toasts = this.toasts.filter(t => t.id !== id);
        }
      };
    }
  </script>
</body>
</html>
