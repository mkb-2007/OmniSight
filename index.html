<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniSight Chennai - Municipal Road Infrastructure Intelligence</title>
  <meta name="description" content="Enterprise road health monitoring, societal drain economic tracking, ward-level active triage, and edge bus fleet diagnostics for Greater Chennai Corporation." />
  <meta property="og:title" content="OmniSight Chennai - Municipal Road Infrastructure Intelligence" />
  <meta property="og:description" content="Enterprise road health monitoring, societal drain economic tracking, ward-level active triage, and edge bus fleet diagnostics for Greater Chennai Corporation." />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <!-- Leaflet.js Interactive Map Engine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-pulse-subtle { animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes ping-slow {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .animate-ping-slow { animation: ping-slow 2s cubic-bezier(0, 0, 0.2, 1) infinite; }

    /* Clean scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f9fafb; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

    /* ========================================================================= */
    /* OMNISIGHT PRODUCTION STARTUP / LOADING SCREEN STYLES                      */
    /* ========================================================================= */
    #omnisight-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background-color: #f1f5f9;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      visibility: visible;
      transition: opacity 450ms cubic-bezier(0.4, 0, 0.2, 1), visibility 450ms;
      user-select: none;
    }

    #omnisight-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* 16:9 Aspect Ratio Stage covering viewport without distortion */
    .loading-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: max(100vw, calc(100vh * 16 / 9));
      height: max(calc(100vw * 9 / 16), 100vh);
      overflow: hidden;
    }

    /* Smooth Dynamic Shimmer Highlight across the Cyan-Blue Gradient Bar */
    @keyframes barShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .progress-fill-shimmer {
      background: linear-gradient(
        90deg,
        #1d64ec 0%,
        #2a88fe 25%,
        #38bdf8 50%,
        #19e0ef 75%,
        #0ceed2 100%
      );
      background-size: 200% 100%;
      animation: barShimmer 3s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.5), 0 0 4px rgba(42, 136, 254, 0.6);
    }

    /* Concentric Ground Radar Pulse Waves on Bus (78.6%, 66.8%) */
    @keyframes sensorRingExpand {
      0% {
        transform: translate(-50%, -50%) scale(0.2, 0.08);
        opacity: 0.9;
      }
      50% {
        opacity: 0.6;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.5, 1.1);
        opacity: 0;
      }
    }

    .sensor-ring {
      position: absolute;
      top: 88.5%;
      left: 81.5%;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 229, 255, 0.85);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.5), inset 0 0 8px rgba(0, 229, 255, 0.25);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.2, 0.08);
      animation: sensorRingExpand 2.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .sensor-ring-delay-1 {
      animation-delay: 0.9s;
    }

    .sensor-ring-delay-2 {
      animation-delay: 1.8s;
    }

    /* Floating Sensor Arc Waves */
    @keyframes arcPulse {
      0%, 100% { opacity: 0.45; transform: translate(-50%, -75%) scale(0.96); }
      50% { opacity: 0.95; transform: translate(-50%, -75%) scale(1.04); }
    }

    .sensor-arc {
      animation: arcPulse 2.4s ease-in-out infinite;
    }

    /* Asphalt Laser Sweep Line */
    @keyframes groundSweep {
      0% { transform: translate(-50%, 0) translateY(0) scaleX(0.7); opacity: 0.75; }
      50% { transform: translate(-50%, 0) translateY(20px) scaleX(1.3); opacity: 0.25; }
      100% { transform: translate(-50%, 0) translateY(38px) scaleX(1.7); opacity: 0; }
    }

    .ground-scan-beam {
      animation: groundSweep 2.2s ease-out infinite;
    }

    /* Small subtle breathing pulse for INITIALIZING text */
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .initializing-pulse {
      animation: subtlePulse 1.8s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen" x-data="app()" x-init="initApp()">

  <!-- ========================================================================= -->
  <!-- OMNISIGHT PRODUCTION STARTUP / LOADING SCREEN                             -->
  <!-- ========================================================================= -->
  <div id="omnisight-loader" :class="{ 'fade-out': loaderFading }" x-show="!loaderHidden">
    <div class="loading-stage">
      <!-- High-resolution clean photographic environment with highway & bus -->
      <img src="/omnisight-bg-2x.png"
           alt="OmniSight Infrastructure Highway Environment"
           class="absolute inset-0 w-full h-full object-cover object-center pointer-events-none select-none" />

      <!-- Subtle blue/cyan sensor waves, data signals & scanning effects around the bus -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <!-- Concentric Ground Radar Rings (perspective matched to highway under bus tires) -->
        <div class="sensor-ring"></div>
        <div class="sensor-ring sensor-ring-delay-1"></div>
        <div class="sensor-ring sensor-ring-delay-2"></div>

        <!-- Rooftop Sensor Dome Pulsing Beacon -->
        <div class="absolute" style="left: 80.8%; top: 67.5%; transform: translate(-50%, -50%);">
          <div class="w-3.5 h-3.5 rounded-full bg-cyan-400 opacity-75 blur-xs animate-ping"></div>
          <div class="absolute inset-0 w-2.5 h-2.5 m-auto rounded-full bg-white shadow-[0_0_10px_#00e5ff]"></div>
        </div>

        <!-- SVG Holographic Scanning Arcs around the bus rooftop sensor -->
        <svg class="absolute sensor-arc"
             style="left: 80.8%; top: 67.5%; width: 280px; height: 180px; transform: translate(-50%, -75%);"
             viewBox="0 0 280 180" fill="none">
          <!-- Concentric upward arcs (simulating lidar radar fan) -->
          <path d="M 35,145 A 110,72 0 0,1 245,145" stroke="url(#cyanGlowGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.75" />
          <path d="M 60,145 A 85,52 0 0,1 220,145" stroke="url(#cyanGlowGrad)" stroke-width="2" opacity="0.85" />
          <path d="M 85,145 A 60,34 0 0,1 195,145" stroke="url(#cyanGlowGrad)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.95" />
          <!-- Downward asphalt scanning fan -->
          <polygon points="140,145 65,180 215,180" fill="url(#fanBeamGrad)" opacity="0.35" class="ground-scan-beam" />
          <defs>
            <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0077b6" stop-opacity="0.2" />
              <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.95" />
              <stop offset="70%" stop-color="#00f5d4" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#0077b6" stop-opacity="0.2" />
            </linearGradient>
            <linearGradient id="fanBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6" />
              <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- Minimal Sleek Progress Bar with 68% beside it -->
      <div class="absolute left-1/2 flex items-center justify-center pointer-events-auto"
           style="top: 58.85%; transform: translate(-50%, -50%); width: clamp(280px, 28%, 430px);">
        <!-- Horizontal Progress Bar Track -->
        <div class="h-[12px] flex-1 bg-[#dbe1eb] rounded-full overflow-hidden p-[1.5px] shadow-[inset_0_1px_2px_rgba(0,0,0,0.08)]">
          <!-- Filled Gradient Bar -->
          <div class="h-full rounded-full progress-fill-shimmer transition-all duration-150 ease-out"
               :style="{ width: loadingProgress + '%' }"></div>
        </div>

        <!-- 68% Beside Progress Bar -->
        <div class="ml-3 font-semibold text-[13px] text-[#475569] font-sans tracking-tight shrink-0 select-none min-w-[36px] text-left"
             x-text="displayPercent">
          68%
        </div>
      </div>

      <!-- "INITIALIZING..." Underneath in small, clean typography -->
      <div class="absolute left-1/2 text-center pointer-events-none select-none initializing-pulse"
           style="top: 62.5%; transform: translate(-50%, -50%);">
        <span class="text-[10px] tracking-[0.28em] font-semibold text-[#64748b] uppercase font-sans">
          INITIALIZING...
        </span>
      </div>
    </div>
  </div>

  <!-- GLOBAL HEADER (OmniSight Navigation & Unified Entry) -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/80 px-6 sm:px-8 py-3.5 flex items-center justify-between shadow-xs transition-all">
    <!-- Left: OmniSight Logo & Tagline -->
    <div class="flex items-center space-x-4">
      <button @click="navigateLanding()" class="flex items-center space-x-3 group focus:outline-hidden text-left cursor-pointer">
        <img src="/omnisight-header-logo.png" alt="OmniSight - SEE WHAT MATTERS. ACT WHERE IT COUNTS." class="h-8 sm:h-9 w-auto object-contain transition group-hover:opacity-90" />
      </button>

      <!-- Active Portal Tag (When Logged In) -->
      <template x-if="authState === 'AUTHENTICATED' && currentUser && currentView !== 'landing'">
        <div class="hidden lg:flex items-center pl-4 border-l border-slate-200 text-xs space-x-2.5">
          <span class="px-2.5 py-0.5 rounded-full font-bold text-[11px] border tracking-wide uppercase font-mono"
            :class="{
              'bg-blue-50 text-blue-700 border-blue-200': currentUser.role === 'CITY',
              'bg-emerald-50 text-emerald-700 border-emerald-200': currentUser.role === 'WARD',
              'bg-purple-50 text-purple-700 border-purple-200': currentUser.role === 'DEVELOPER'
            }"
            x-text="currentUser.role + ' PORTAL'">
          </span>
          <template x-if="currentUser.role === 'DEVELOPER'">
            <div class="inline-flex items-center space-x-1 text-slate-600 text-xs font-medium bg-slate-50 border border-slate-200/80 px-2 py-0.5 rounded-full">
              <svg class="w-3 h-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <span>Arunachalam</span>
            </div>
          </template>
          <template x-if="currentUser.role !== 'DEVELOPER'">
            <span class="text-slate-600 font-mono text-[11px] truncate max-w-[140px]" x-text="currentUser.fullName.split(' ')[0]"></span>
          </template>
        </div>
      </template>
    </div>

    <!-- Center: Navigation Links (Visible ONLY when Unauthenticated) -->
    <template x-if="authState !== 'AUTHENTICATED'">
      <nav class="hidden md:flex items-center space-x-6 lg:space-x-8 text-sm font-medium">
        <button @click="navigateLanding(); scrollToSection('hero')"
          class="transition cursor-pointer pb-0.5"
          :class="currentView === 'landing' && activeSection === 'hero' ? 'text-[#0077b6] font-semibold border-b-2 border-[#0077b6]' : 'text-slate-600 hover:text-slate-900'">
          Home
        </button>
        <button @click="scrollToSection('about')"
          class="transition cursor-pointer pb-0.5"
          :class="currentView === 'landing' && activeSection === 'about' ? 'text-[#0077b6] font-semibold border-b-2 border-[#0077b6]' : 'text-slate-600 hover:text-slate-900'">
          About
        </button>
        <button @click="scrollToSection('features')"
          class="transition cursor-pointer pb-0.5"
          :class="currentView === 'landing' && activeSection === 'features' ? 'text-[#0077b6] font-semibold border-b-2 border-[#0077b6]' : 'text-slate-600 hover:text-slate-900'">
          Features
        </button>
        <button @click="scrollToSection('impact')"
          class="transition cursor-pointer pb-0.5"
          :class="currentView === 'landing' && activeSection === 'impact' ? 'text-[#0077b6] font-semibold border-b-2 border-[#0077b6]' : 'text-slate-600 hover:text-slate-900'">
          Impact
        </button>
        <button @click="scrollToSection('contact')"
          class="transition cursor-pointer pb-0.5"
          :class="currentView === 'landing' && activeSection === 'contact' ? 'text-[#0077b6] font-semibold border-b-2 border-[#0077b6]' : 'text-slate-600 hover:text-slate-900'">
          Contact
        </button>
      </nav>
    </template>

    <!-- Right: Header Action Controls -->
    <div class="flex items-center space-x-3 sm:space-x-4">

      <!-- Prominent Header Login Button (Visible ONLY when Unauthenticated on Home page) -->
      <template x-if="authState === 'UNAUTHENTICATED' && currentView === 'landing'">
        <button @click="navigateToPortalSelect()"
          id="header-login-btn"
          class="inline-flex items-center space-x-2 px-4 sm:px-5 py-2 rounded-full bg-gradient-to-r from-[#0077b6] to-[#00b4d8] hover:from-[#006097] hover:to-[#0096c7] text-white text-xs sm:text-sm font-semibold shadow-md shadow-cyan-500/20 hover:shadow-cyan-500/35 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 cursor-pointer">
          <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span>Login</span>
        </button>
      </template>

      <!-- Authenticated Header Controls (Visible ONLY when Authenticated) -->
      <template x-if="authState === 'AUTHENTICATED' && currentUser">
        <div class="flex items-center space-x-2 sm:space-x-3">
          <!-- Notification Bell for Developer (matching reference image) -->
          <template x-if="currentUser.role === 'DEVELOPER'">
            <div class="relative p-1.5 rounded-full hover:bg-slate-100 text-slate-600 cursor-pointer transition">
              <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
              <span class="absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] font-bold flex items-center justify-center shadow-xs">3</span>
            </div>
          </template>

          <!-- Developer Profile Indicator (matching reference image) -->
          <template x-if="currentUser.role === 'DEVELOPER'">
            <div class="hidden sm:flex items-center space-x-2 pl-2 border-l border-slate-200">
              <div class="w-8 h-8 rounded-full bg-purple-600 text-white font-bold flex items-center justify-center text-xs shadow-xs">
                D
              </div>
              <div class="flex flex-col text-left leading-tight">
                <span class="text-xs font-bold text-slate-800">Developer</span>
                <span class="text-[10px] text-slate-400 font-mono">developer_admin</span>
              </div>
            </div>
          </template>

          <!-- City Official Profile Indicator -->
          <template x-if="currentUser.role === 'CITY'">
            <div class="hidden sm:flex items-center space-x-2 pl-2 border-l border-slate-200">
              <div class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xs shadow-xs">
                C
              </div>
              <div class="flex flex-col text-left leading-tight">
                <span class="text-xs font-bold text-slate-800">City Official</span>
                <span class="text-[10px] text-slate-400 font-mono">gcc.commissioner</span>
              </div>
            </div>
          </template>

          <!-- Ward Officer Profile Indicator -->
          <template x-if="currentUser.role === 'WARD'">
            <div class="hidden sm:flex items-center space-x-2 pl-2 border-l border-slate-200">
              <div class="w-8 h-8 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-xs shadow-xs">
                W
              </div>
              <div class="flex flex-col text-left leading-tight">
                <span class="text-xs font-bold text-slate-800">Ward Officer</span>
                <span class="text-[10px] text-slate-400 font-mono">ward172.adyar</span>
              </div>
            </div>
          </template>

          <!-- If on Landing page while authenticated, show quick return to dashboard button -->
          <template x-if="currentView === 'landing'">
            <button @click="redirectToAuthorizedPortal()"
              class="inline-flex items-center space-x-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold border transition cursor-pointer shadow-2xs"
              :class="{
                'bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-100': currentUser.role === 'CITY',
                'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100': currentUser.role === 'WARD',
                'bg-purple-50 text-purple-700 border-purple-200 hover:bg-purple-100': currentUser.role === 'DEVELOPER'
              }">
              <span x-text="currentUser.role + ' Dashboard'"></span>
              <span>→</span>
            </button>
          </template>

          <!-- Sign Out Button -->
          <button @click="logout()"
            title="Sign Out"
            class="text-xs font-semibold text-slate-500 hover:text-red-600 border border-slate-200 hover:border-red-200 hover:bg-red-50 rounded-full px-3 py-1.5 transition flex items-center space-x-1 cursor-pointer">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            <span class="hidden sm:inline">Sign Out</span>
          </button>
        </div>
      </template>

    </div>
  </header>

  <!-- TOAST NOTIFICATION CONTAINER (Authenticated Roles Only) -->
  <template x-if="authState === 'AUTHENTICATED' && toasts.length > 0">
    <div class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 max-w-md w-full pointer-events-none">
      <template x-for="t in toasts" :key="t.id">
        <div class="pointer-events-auto bg-white border border-slate-200 rounded-lg shadow-lg p-3.5 flex items-start space-x-3 transition transform duration-200 ease-out border-l-4"
          :class="t.level === 'L1' ? 'border-l-red-500' : 'border-l-cyan-500'">
          <div class="shrink-0 mt-0.5">
            <span class="relative flex h-2.5 w-2.5">
              <span class="animate-ping-slow absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#0077b6]"></span>
            </span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-xs font-bold text-slate-900 flex items-center justify-between">
              <span x-text="t.title"></span>
              <span class="text-[10px] font-mono text-slate-400 font-normal" x-text="t.time"></span>
            </div>
            <div class="text-xs text-slate-600 font-mono mt-0.5 truncate" x-text="t.desc"></div>
            <div class="text-[10px] text-slate-400 font-mono mt-1" x-text="t.meta"></div>
          </div>
          <button @click="removeToast(t.id)" class="text-slate-400 hover:text-slate-600 text-sm leading-none cursor-pointer">&times;</button>
        </div>
      </template>
    </div>
  </template>

  <!-- MAIN APP WRAPPER -->
  <main class="min-h-[calc(100vh-68px)]">

    <!-- ========================================================================= -->
    <!-- STATE 1: LANDING & HERO PAGE -->
    <!-- ========================================================================= -->
    <template x-if="currentView === 'landing'">
      <div class="w-full bg-white">
      
      <!-- HERO SECTION (Matching User Mockup Reference Exactly) -->
      <section id="hero" class="relative min-h-[calc(100vh-68px)] bg-gradient-to-b from-[#f8fafc] via-white to-[#f0f9ff]/40 flex flex-col justify-between overflow-hidden">
        
        <!-- Subtle Pattern Background -->
        <div class="absolute inset-0 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:28px_28px] opacity-35 pointer-events-none"></div>

        <!-- Hero Main Content Grid -->
        <div class="relative z-10 max-w-7xl mx-auto px-6 sm:px-8 pt-8 sm:pt-14 pb-10 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center flex-1">
          
          <!-- Left Column: Typography, Tag, Pillars, Call to Action -->
          <div class="lg:col-span-6 flex flex-col justify-center space-y-6 sm:space-y-7">
            
            <!-- Category Tag Pill -->
            <div class="inline-flex items-center space-x-2.5 px-4 py-1.5 rounded-full bg-blue-50/90 border border-blue-200/80 text-xs sm:text-sm font-medium w-fit shadow-2xs">
              <span class="text-[#0077b6] font-semibold">Smart Infrastructure</span>
              <span class="text-blue-300">|</span>
              <span class="text-slate-600">AI-Powered Road Monitoring</span>
            </div>

            <!-- Main Headline -->
            <div>
              <h1 class="text-4xl sm:text-5xl lg:text-[56px] font-extrabold tracking-tight text-slate-900 leading-[1.12]">
                Safer Roads<br />
                <span class="bg-gradient-to-r from-[#0077b6] via-[#0096c7] to-[#00b4d8] bg-clip-text text-transparent">Stronger Cities</span>
              </h1>
            </div>

        // ------------------------------------------------------------------
        // Lifecycle & Initialization
        // ------------------------------------------------------------------
        async initApp() {
          window.addEventListener('hashchange', () => this.handleRoute());
          this.startStartupSequence();
          this.startClock();
          this.startTickerIncrement();
          this.startL1Countdown();

          // Initialize single reliable authentication state
          await this.verifySession();
          this.handleRoute();
        },

        async fetchWithAuth(url, options = {}) {
          const headers = {
            'Content-Type': 'application/json',
            ...(options.headers || {})
          };
          if (this.authToken) {
            headers['Authorization'] = `Bearer ${this.authToken}`;
          }
          const response = await fetch(url, { ...options, headers });
          if (response.status === 401) {
            this.clearSessionState();
            throw new Error('Session expired');
          }
          if (response.status === 403) {
            const data = await response.json();
            throw new Error(data.error);
          }
          return response.json();
        },

        async verifySession() {
          this.authState = 'AUTH_LOADING';
          try {
            const headers = { 'Content-Type': 'application/json' };
            if (this.authToken) {
              headers['Authorization'] = `Bearer ${this.authToken}`;
            }
            const response = await fetch('/api/auth/me', { headers });
            if (response.ok) {
              const res = await response.json();
              if (res.success && res.user) {
                this.currentUser = res.user;
                this.authState = 'AUTHENTICATED';
                this.startRoleScopedAlerts(res.user.role);
                return;
              }
            }
            this.clearSessionState();
          } catch (e) {
            this.clearSessionState();
          }
        },

        clearSessionState() {
          this.currentUser = null;
          this.authToken = null;
          this.authState = 'UNAUTHENTICATED';
          this.toasts = [];
          this.stopRoleScopedAlerts();
          localStorage.removeItem('omnisight_token');
        },

        startStartupSequence() {
          this.isLoading = true;
          this.loaderFading = false;
          this.loaderHidden = false;
          this.loadingProgress = 0;
          this.displayPercent = '0%';

          const startTime = performance.now();
          const MIN_HOLD_MS = 2000; // Strict hold duration: 2.0s (at most 2.5s total including fade)

          const milestones = [
            { t: 0, p: 0 },
            { t: 300, p: 24 },
            { t: 600, p: 48 },
            { t: 900, p: 68 }, // Reference 68% milestone
            { t: 1400, p: 68 }, // Holds at 68%
            { t: 1750, p: 90 },
            { t: 2000, p: 100 }
          ];

          let animFrameId = null;

          const tick = (now) => {
            const elapsed = now - startTime;
            let currentP = 0;
            if (elapsed >= 2000) {
              currentP = 100;
            } else {
              for (let i = 0; i < milestones.length - 1; i++) {
                const m1 = milestones[i];
                const m2 = milestones[i + 1];
                if (elapsed >= m1.t && elapsed <= m2.t) {
                  const factor = (elapsed - m1.t) / (m2.t - m1.t);
                  const ease = factor < 0.5 ? 2 * factor * factor : 1 - Math.pow(-2 * factor + 2, 2) / 2;
                  currentP = m1.p + (m2.p - m1.p) * ease;
                  break;
                }
              }
            }

            this.loadingProgress = Math.min(100, Math.round(currentP));
            this.displayPercent = this.loadingProgress + '%';

            if (elapsed >= MIN_HOLD_MS && this.loadingProgress >= 100) {
              this.loaderFading = true;
              setTimeout(() => {
                this.isLoading = false;
                this.loaderHidden = true;
                this.handleRoute();
              }, 450);
            } else {
              animFrameId = requestAnimationFrame(tick);
            }
          };

          animFrameId = requestAnimationFrame(tick);

          window.replayStartupLoader = () => {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            this.startStartupSequence();
          };
        },

        triggerLoadingIntro() {
          this.startStartupSequence();
        },

        // ------------------------------------------------------------------
        // URL Hash Routing & Role-Based Navigation Guard
        // ------------------------------------------------------------------
        handleRoute() {
          const hash = window.location.hash || '#/';
          const cleanHash = hash.replace(/^#\/?/, '').toLowerCase();
          const parts = cleanHash.split('/');
          const section = parts[0] || '';
          const sub = parts[1] || '';

          // Section anchors on landing
          if (section === 'about' || section === 'features' || section === 'impact' || section === 'contact') {
            this.currentView = 'landing';
            this.activeSection = section;
            this.showLoginModal = false;
            this.$nextTick(() => {
              const el = document.getElementById(section);
              if (el) el.scrollIntoView({ behavior: 'smooth' });
            });
            return;
          }

          // 1. Landing (Home)
          if (!section || section === 'landing') {
            this.currentView = 'landing';
            this.activeSection = 'hero';
            this.showLoginModal = false;
            return;
          }

          // 2. Portal Selection Page
          if (section === 'portal-select' || section === 'portals' || section === 'choose-portal') {
            if (this.authState === 'AUTHENTICATED' && this.currentUser) {
              this.redirectToAuthorizedPortal();
            } else {
              this.currentView = 'portal-select';
              this.showLoginModal = false;
              this.$nextTick(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
              });
            }
            return;
          }

          // 3. Direct Login Links (Individual Portal Login)
          if (section === 'login') {
            if (this.authState === 'AUTHENTICATED' && this.currentUser) {
              this.redirectToAuthorizedPortal();
            } else {
              this.currentView = 'portal-select';
              const target = (sub === 'dev' || sub === 'developer') ? 'dev' : (sub === 'ward' ? 'ward' : 'city');
              this.openLogin(target);
            }
            return;
          }

          // 4. Protected Portal: City
          if (section === 'city') {
            if (this.authState !== 'AUTHENTICATED' || !this.currentUser) {
              this.currentView = 'portal-select';
              window.location.hash = '#/portal-select';
              this.openLogin('city');
              return;
            }
            if (this.currentUser.role !== 'CITY') {
              this.redirectToAuthorizedPortal();
              return;
            }
            this.currentView = 'city';
            if (sub === 'map') this.cityTab = 'economic';
            else if (sub === 'hazards' || sub === 'budget') this.cityTab = 'budget';
            else if (sub === 'analytics' || sub === 'economic') this.cityTab = 'economic';
            else if (sub === 'leaderboard') this.cityTab = 'leaderboard';
            this.loadPortalData('city');
            return;
          }

          // 5. Protected Portal: Ward
          if (section === 'ward') {
            if (this.authState !== 'AUTHENTICATED' || !this.currentUser) {
              this.currentView = 'portal-select';
              window.location.hash = '#/portal-select';
              this.openLogin('ward');
              return;
            }
            if (this.currentUser.role !== 'WARD') {
              this.redirectToAuthorizedPortal();
              return;
            }
            this.currentView = 'ward';
            if (sub === 'incidents' || sub === 'kanban') this.wardTab = 'kanban';
            else if (sub === 'map' || sub === 'triage') this.wardTab = 'triage';
            else if (sub === 'repairs' || sub === 'verification') this.wardTab = 'verification';
            else if (sub === 'settings') this.wardTab = 'settings';
            this.loadPortalData('ward');
            return;
          }

          // 6. Protected Portal: Developer
          if (section === 'developer' || section === 'dev') {
            if (this.authState !== 'AUTHENTICATED' || !this.currentUser) {
              this.currentView = 'portal-select';
              window.location.hash = '#/portal-select';
              this.openLogin('dev');
              return;
            }
            if (this.currentUser.role !== 'DEVELOPER') {
              this.redirectToAuthorizedPortal();
              return;
            }
            this.currentView = 'dev';
            if (sub === 'devices' || sub === 'fleet') this.devTab = 'fleet';
            else if (sub === 'telemetry' || sub === 'diagnostics') this.devTab = 'diagnostics';
            else if (sub === 'system' || sub === 'bandwidth') this.devTab = 'bandwidth';
            else if (sub === 'settings') this.devTab = 'settings';
            else if (sub === 'logs') this.devTab = 'logs';
            else if (sub === 'hardware' || sub === 'mgmt') this.devTab = 'devices';
            else if (sub === 'api') this.devTab = 'api';
            this.loadPortalData('dev');
            return;
          }

          this.currentView = 'landing';
        },

        redirectToAuthorizedPortal() {
          if (!this.currentUser) {
            window.location.hash = '#/';
            this.currentView = 'landing';
            return;
          }
          if (this.currentUser.role === 'CITY') {
            window.location.hash = '#/city';
          } else if (this.currentUser.role === 'WARD') {
            window.location.hash = '#/ward';

        get selectedBus() {
          return this.selectedDevBus || this.fleetNodes[2] || this.fleetNodes[0];
        },

        get filteredFleetNodes() {
          let list = [...this.fleetNodes];

          // 1. Status Filter
          if (this.fleetStatusFilter === 'online') {
            list = list.filter(b => b.online);
          } else if (this.fleetStatusFilter === 'offline') {
            list = list.filter(b => !b.online);
          }

          // 2. Route Filter
          if (this.fleetRouteFilter && this.fleetRouteFilter !== 'all') {
            list = list.filter(b => b.route.toLowerCase().includes(this.fleetRouteFilter.toLowerCase()));
          }

          // 3. Search Query
          if (this.fleetSearchQuery.trim()) {
            const q = this.fleetSearchQuery.toLowerCase().trim();
            list = list.filter(b =>
              b.busNumber.toLowerCase().includes(q) ||
              b.route.toLowerCase().includes(q) ||
              (b.id && b.id.toLowerCase().includes(q))
            );
          }

          // 4. Sort Field
          if (this.fleetSortBy === 'busNumber') {
            list.sort((a, b) => a.busNumber.localeCompare(b.busNumber, undefined, { numeric: true }));
          } else if (this.fleetSortBy === 'camFps') {
            list.sort((a, b) => b.camFps - a.camFps);
          } else if (this.fleetSortBy === 'jetsonTemp') {
            list.sort((a, b) => a.jetsonTemp - b.jetsonTemp);
          } else if (this.fleetSortBy === 'sqliteUsage') {
            list.sort((a, b) => a.sqliteUsage - b.sqliteUsage);
          } else if (this.fleetSortBy === 'lteDbm') {
            list.sort((a, b) => b.lteDbm - a.lteDbm);
          } else if (this.fleetSortBy === 'uptime') {
            list.sort((a, b) => b.uptime.localeCompare(a.uptime));
          }

          return list;
        },

        },

          this.fillUnifiedDemo(this.pendingTargetView || 'city');

        scrollToSection(id) {
          if (this.currentView !== 'landing') {
            this.navigateLanding();
          }
          this.activeSection = id;
          this.$nextTick(() => {

            if (el) {

        async submitLogin() {
          if (!this.loginForm.username || !this.loginForm.password) {
            this.loginError = 'Please enter both User ID and Password.';
            return;
          }

          this.isAuthenticating = true;
          this.loginError = '';

          try {
            const res = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: this.loginForm.username,
                password: this.loginForm.password,
                portal: this.pendingTargetView === 'dev' ? 'developer' : this.pendingTargetView
              })
            });

            const data = await res.json();
            if (!res.ok || !data.success) {
              this.loginError = data.error || 'Authentication failed. Please verify credentials.';
              this.isAuthenticating = false;
              return;
            }

            this.authToken = data.token;
            localStorage.setItem('omnisight_token', data.token);
            this.currentUser = data.user;
            this.authState = 'AUTHENTICATED';
            this.showLoginModal = false;
            this.isAuthenticating = false;

            // Start role-scoped alerts strictly for authorized user role
            this.startRoleScopedAlerts(data.user.role);

            // One-time Authenticated toast displayed immediately after interactive login
            this.addToast('✅ Authenticated', `Signed in as ${data.user.fullName} (${data.user.role})`, 'L3');

            // Dynamic role-based redirection to authorized dashboard
            if (data.user.role === 'CITY') {
              window.location.hash = '#/city';
              this.currentView = 'city';
              await this.loadPortalData('city');
            } else if (data.user.role === 'WARD') {
              window.location.hash = '#/ward';
              this.currentView = 'ward';
              await this.loadPortalData('ward');
            } else if (data.user.role === 'DEVELOPER') {
              window.location.hash = '#/developer';
              this.currentView = 'dev';
              await this.loadPortalData('dev');
            } else {
              window.location.hash = '#/';
              this.currentView = 'landing';
            }
          } catch (e) {
            this.loginError = e.message || 'Network error connecting to OmniSight API.';
            this.isAuthenticating = false;
          }
        },

        async logout() {
          try {
            await fetch('/api/auth/logout', { method: 'POST' });
          } catch (e) {}
          this.clearSessionState();
          this.currentView = 'landing';
          this.activeSection = 'hero';
          this.showLoginModal = false;
          window.location.hash = '#/';
        },

        navigateLanding() {
          this.currentView = 'landing';
          this.activeSection = 'hero';
          this.showLoginModal = false;
          window.location.hash = '#/';
          this.$nextTick(() => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        },

        // ------------------------------------------------------------------
        async loadPortalData(view) {
          if (view === 'city') {
            await this.loadCityData();
            this.$nextTick(() => {
              this.initChennaiMap();

        async loadCityData() {
          try {
            const [dash, budget, roads, hazards] = await Promise.all([
              this.fetchWithAuth('/api/city/dashboard'),
              this.fetchWithAuth('/api/city/budget'),
              this.fetchWithAuth('/api/city/roads'),
              this.fetchWithAuth('/api/city/hazards')
            ]);

            if (dash.success) {
              this.societalDrain = dash.data.societalDrain;
              this.leaderboard = dash.data.leaderboard;
            }
            if (budget.success) {
              this.budgetItems = budget.data;
              this.totalApprovedBudget = this.budgetItems
                .filter(b => b.status === 'APPROVED')
                .reduce((acc, b) => acc + b.repairCost, 0);
            }
            if (roads.success) this.cityRoads = roads.data;
            if (hazards.success) this.cityHazards = hazards.data;
          } catch (e) {
            console.error('Error loading city data:', e);

          try {

              this.fetchWithAuth('/api/ward/dashboard'),
              this.fetchWithAuth('/api/ward/incidents')
            ]);
            if (incs.success) {
              this.kanbanCards = incs.data;
            }
          } catch (e) {
            console.error('Error loading ward data:', e);

              this.fetchWithAuth('/api/developer/devices'),

              this.diagnosticLogs = telemetry.data.map(t =>
                `[${new Date(t.timestamp).toTimeString().split(' ')[0]}] [${t.device?.vehicle?.vehicleNumber ? 'BUS#' + t.device.vehicle.vehicleNumber : 'NODE'}] [TELEMETRY] Ax: ${t.axG}g, Ay: ${t.ayG}g, Az: ${t.azG}g | GPS: ${t.latitude.toFixed(4)}, ${t.longitude.toFixed(4)} | Conf: ${t.visionConfidence}`

        // ------------------------------------------------------------------
        // Clock, Simulation & Toasts
        // ------------------------------------------------------------------
        startClock() {
          const update = () => {
            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const dayName = days[now.getDay()];
            const day = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            this.clockString = `${dayName}, ${day} ${month} ${year} | ${h}:${m}:${s} IST`;
          };
          update();
          setInterval(update, 1000);
        },

        startTickerIncrement() {
          setInterval(() => {
            this.societalDrain += Math.floor(Math.random() * 45) + 10;
          }, 1500);
        },

        startL1Countdown() {
          setInterval(() => {
            if (this.l1TimerSeconds > 0) {
              this.l1TimerSeconds--;
              const hrs = String(Math.floor(this.l1TimerSeconds / 3600)).padStart(2, '0');
              const mins = String(Math.floor((this.l1TimerSeconds % 3600) / 60)).padStart(2, '0');
              const secs = String(this.l1TimerSeconds % 60).padStart(2, '0');
              this.l1TimerString = `${hrs}:${mins}:${secs}`;
            }
          }, 1000);
        },

            // Technical / edge device / telemetry alerts
            alerts = [
              { title: "📡 Edge Fleet Sync Complete", desc: "Bus #47 Jetson Orin Nano connected via 4G LTE", meta: "SQLite 38% • Jetson Temp: 54°C • FPS: 30.0", level: "L3" },
              { title: "⚠️ Sensor Fusion Disparity Flagged", desc: "Bus #19B IMU vs Vision Discrepancy", meta: "Dynamic Object Suppressed • Confidence: 94%", level: "L2" },
              { title: "🔴 Depot AP Disconnect Warning", desc: "Bus #05 Packet latency high (> 450ms)", meta: "LTE: -81 dBm • Firmware: v2.4.1", level: "L1" }
            ];
          }

          if (alerts.length === 0) return;

          let idx = 0;
          this.alertIntervalId = setInterval(() => {
            if (this.authState !== 'AUTHENTICATED') {
              this.stopRoleScopedAlerts();
              return;
            }
            const template = alerts[idx % alerts.length];
            this.addToast(template.title, template.desc, template.level, template.meta);
            idx++;
          }, 15000);
        },

        addToast(title, desc, level = 'L3', meta = '') {
          // Strictly prevent adding any toast if user is unauthenticated
          if (this.authState !== 'AUTHENTICATED') return;

          const time = new Date().toTimeString().split(' ')[0];
          const id = this.toastCounter++;
          const toast = {
            id,
            title,
            desc,
            meta,
            level,
            time
          };
          this.toasts.unshift(toast);
          if (this.toasts.length > 3) this.toasts.pop();

          // Auto-dismiss toasts after 7 seconds
          setTimeout(() => {
            this.removeToast(id);
          }, 7000);
        },

        removeToast(id) {
          this.toasts = this.toasts.filter(t => t.id !== id);
        }
      };
    }
  </script>
</body>
